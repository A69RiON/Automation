<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="admin.html">Rental Admin</a><nav><a href="index.html">View public site</a><button class="button" id="logoutBtn" hidden>Log out</button></nav></header><main><section id="loginPanel" class="panel" style="max-width:560px"><h1>Admin login</h1><label>Username<input id="username"></label><label>Password<input id="password" type="password"></label><button class="button primary" id="loginBtn">Log in</button><div id="loginMsg" class="result"></div></section><section id="adminPanel" hidden><div class="admin-header"><div><p class="eyebrow">ADMIN</p><h1>Marketplace dashboard</h1></div><button class="button" id="refreshBtn">Refresh</button></div><div class="metrics" id="metrics"></div><nav class="tabs"><button class="tab active" data-tab="orders">Orders</button><button class="tab" data-tab="catalogue">Catalogue</button><button class="tab" data-tab="settings">Site Settings</button></nav>
<section id="ordersTab"><nav class="subtabs" id="orderTabs"><button class="subtab active" data-status="pending">Pending</button><button class="subtab" data-status="active">Active</button><button class="subtab" data-status="completed">Completed</button><button class="subtab" data-status="cancelled">Cancelled</button></nav><div class="panel"><div class="table-wrap" id="orders"></div></div></section>
<section id="catalogueTab" hidden><nav class="subtabs"><button class="subtab active" data-cat="rentals">Rentals</button><button class="subtab" data-cat="sales">Sale Items</button><button class="subtab" data-cat="disabled">Disabled</button><button class="subtab" data-cat="archived">Archived</button></nav><div class="two-col"><div class="panel"><h2>Add / edit offering</h2><label>Title<input id="title"></label><label>Type<select id="type"><option value="digital_rental">Rental</option><option value="digital_product">Sale item</option></select></label><label>Platform / category<input id="platform"></label><label>Description<textarea id="description"></textarea></label><div id="rentalFields"><label>Copies<input id="copies" type="number" min="1" value="1"></label><div class="split"><label>Primary weekly<input id="pw" type="number" step=".01"></label><label>Primary monthly<input id="pm" type="number" step=".01"></label><label>Secondary weekly<input id="sw" type="number" step=".01"></label><label>Secondary monthly<input id="sm" type="number" step=".01"></label></div><label>Max rental days<input id="maxdays" type="number" min="7" value="90"></label></div><div id="saleFields" hidden><div class="split"><label>Regular price<input id="rp" type="number" step=".01"></label><label>Sale price<input id="sp" type="number" step=".01"></label></div><label>Stock<input id="stock" type="number" min="0" value="0"></label></div><label>Image URL<input id="image"></label><label><input id="featured" type="checkbox" style="width:auto"> Featured</label><button class="button primary" id="saveOffer">Publish offering</button><button class="button" id="cancelEdit" hidden>Cancel edit</button><div id="offerMsg" class="result"></div></div><div class="panel"><h2>Offerings</h2><div id="offers"></div></div></div></section>
<section id="settingsTab" hidden><nav class="subtabs" id="settingsTabs"><button class="subtab active" data-set="general">General</button><button class="subtab" data-set="currency">Currency</button><button class="subtab" data-set="notes">Orders & Notes</button><button class="subtab" data-set="sale">Sale</button><button class="subtab" data-set="payments">Payments</button></nav><div id="generalPane" class="panel"><label>Site name<input id="siteName"></label><label>Hero eyebrow<input id="heroEye"></label><label>Hero title<input id="heroTitleAdmin"></label><label>Hero description<textarea id="heroDescAdmin"></textarea></label><div class="split"><label>Home label<input id="homeLabel"></label><label>Rentals label<input id="rentLabel"></label><label>Sale label<input id="saleLabel"></label><label>Availability label<input id="availLabel"></label></div><button class="button primary" id="saveGeneral">Save & deploy</button></div><div id="currencyPane" class="panel" hidden><label>Default currency<select id="defcur"><option>AUD</option><option>USD</option><option>BDT</option></select></label><label>Allowed currencies<input id="allowed"></label><label><input id="cprompt" type="checkbox" style="width:auto"> Suggest currency from device region</label><div class="split"><label>Fallback USD<input id="fusd" type="number" step=".000001"></label><label>Fallback BDT<input id="fbdt" type="number" step=".000001"></label></div><button class="button primary" id="saveCurrency">Save & deploy</button></div><div id="notesPane" class="panel" hidden><label>Admin note mode<select id="noteMode"><option value="history">Append-only note history</option><option value="single">Single editable note</option></select></label><button class="button primary" id="saveNotes">Save</button></div><div id="salePane" class="panel" hidden><label>Sale heading<input id="saleHead"></label><label>Sale subtitle<textarea id="saleSub"></textarea></label><button class="button primary" id="saveSale">Save & deploy</button></div><div id="paymentsPane" class="panel" hidden><h2>Payment options</h2><p class="meta">Configure now. Actual payment processing can be integrated later.</p><div id="payments"></div><button class="button primary" id="savePayments">Save / Deploy</button></div></section></section></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
