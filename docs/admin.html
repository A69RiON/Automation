<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">Digital Rental Hub AU</a><nav><a href="index.html">Public site</a><a href="availability.html">Availability</a><button id="logoutBtn" class="button" hidden>Log out</button></nav></header><main><section id="loginPanel" class="panel narrow-card"><h1>Admin login</h1><label>Username<input id="username"></label><label>Password<input id="password" type="password"></label><button class="button primary" id="loginBtn">Log in</button><div id="loginMsg" class="result"></div></section><section id="adminPanel" hidden><div class="admin-header"><div><p class="eyebrow">ADMIN</p><h1>Marketplace dashboard</h1></div><button class="button" id="refreshBtn">Refresh</button></div><div class="metrics" id="adminMetrics"></div><nav class="tabs"><button class="tab active" data-tab="orders">Orders</button><button class="tab" data-tab="offerings">Offerings</button><button class="tab" data-tab="settings">Settings</button></nav><section id="ordersTab"><div class="panel"><h2>Bookings</h2><div id="ordersTable" class="table-wrap"></div></div></section><section id="offeringsTab" hidden><div class="two-col"><div class="panel"><h2>Add offering</h2><label>Title<input id="offerTitle"></label><label>Type<select id="offerType"><option value="digital_rental">Digital rental</option><option value="digital_product">Digital product</option><option value="service">Service</option></select></label><label>Platform / category<input id="offerPlatform" placeholder="PS5"></label><label>Description<textarea id="offerDescription" rows="4"></textarea></label><div class="split"><label>Daily rate (AUD)<input id="offerDaily" type="number" step="0.01" min="0"></label><label>Weekly rate (AUD)<input id="offerWeekly" type="number" step="0.01" min="0"></label></div><div class="split"><label>Capacity<input id="offerCapacity" type="number" min="1" value="1"></label><label>Max rental days<input id="offerMaxDays" type="number" min="1" value="14"></label></div><label>Image URL<input id="offerImage" type="url"></label><button class="button primary" id="addOfferingBtn">Publish offering</button><p class="meta">Edit changes future bookings only. Existing booking totals stay unchanged.</p><div id="offerMsg" class="result"></div></div><div class="panel"><h2>Existing offerings</h2><div id="offeringsList"></div></div></div></section><section id="settingsTab" hidden><div class="panel narrow-card"><h2>Site settings</h2><label>Site name<input id="siteName"></label><label>Support email<input id="supportEmail" type="email"></label><label>Currency<input value="AUD" disabled></label><button class="button primary" id="saveSettingsBtn">Save settings</button><div id="settingsMsg" class="result"></div></div></section></section></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
