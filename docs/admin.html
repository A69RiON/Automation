<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AU Deal Hunter Admin</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body>
<header class="topbar"><div><h1>AU Deal Hunter Admin</h1><p>Protected configuration · Australia / AUD</p></div><a class="admin-link" href="index.html">← Dashboard</a></header>
<main class="admin-wrap">
<section id="loginPanel" class="admin-card"><h2>Admin login</h2><p class="muted">Use the secret username and password created in Supabase Auth.</p><label>Username<input id="username" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="primary-btn">Sign in</button><p id="loginMsg" class="muted" aria-live="polite"></p></section>
<section id="adminPanel" hidden>
<div class="admin-head"><div><h2>Control centre</h2><p id="identity" class="muted"></p></div><button id="logoutBtn">Log out</button></div>
<div class="admin-grid">
<section class="admin-card"><h3>Source controls</h3><div id="sources"></div></section>
<section class="admin-card"><h3>Deal settings</h3><div id="settings"></div></section>
<section class="admin-card"><h3>Watchlist</h3><label>Product / keyword<input id="watchQuery" placeholder="e.g. RTX 5080"></label><label>Max price (AUD)<input id="watchPrice" type="number" min="0" step="0.01"></label><label>Minimum discount %<input id="watchDiscount" type="number" min="0" max="100" step="1"></label><button id="addWatch" class="primary-btn">Add watch</button><div id="watchlist"></div></section>
<section class="admin-card"><h3>Blocked listings</h3><label>Title/model pattern<input id="blockPattern" placeholder="Pattern to ignore"></label><label>Reason<input id="blockReason" placeholder="Optional"></label><button id="addBlock">Add block</button><div id="blocks"></div></section>
</div><p id="adminMsg" class="muted" aria-live="polite"></p>
</section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
